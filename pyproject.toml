[project]
name = "dsabot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.4",
    "pyparsing>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.0",
    "psycopg2-binary>=2.9",
    "pony>=0.7.19",
    "minify-html>=0.15",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pre-commit>=4.0",
    "ruff>=0.11",
    "ty>=0.0.1",
]


[tool.ruff]
line-length = 127

[tool.ruff.lint]
ignore = ["E722", "E203"]

[tool.ruff.format]
# ruff format is black-compatible by default

[tool.ty]
python-version = "3.14"
